# 1. H2 Database (In-Memory for Fast Testing)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# 2. MOCK MAIL SETTINGS (Fixes the MAIL_HOST error)
# We provide dummy values so Spring doesn't crash trying to find ${MAIL_HOST}
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test-user
spring.mail.password=test-password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# 3. MOCK RAZORPAY (Fixes potential Razorpay errors)
razorpay.key.id=test_key_123
razorpay.key.secret=test_secret_456

# ? MOCK JWT SETTINGS (Covering both naming conventions)
app.jwtSecret=testSecretKeyForTestingOnlyDoNotUseInProduction1234567890abcdef
library.app.jwtSecret=testSecretKeyForTestingOnlyDoNotUseInProduction1234567890abcdef
app.jwtExpirationMs=3600000
library.app.jwtExpirationMs=3600000

# ? ALSO MOCK THE ENV VARIABLE ITSELF (Just in case)
JWT_SECRET_KEY=testSecretKeyForTestingOnlyDoNotUseInProduction1234567890abcdef

#  MOCK CLOUDINARY SETTINGS
cloudinary.cloud-name=test-cloud
cloudinary.api-key=1234567890
cloudinary.api-secret=abcdefghijklmn
CLOUDINARY_CLOUD_NAME=test-cloud
CLOUDINARY_API_KEY=1234567890
CLOUDINARY_API_SECRET=abcdefghijklmn

