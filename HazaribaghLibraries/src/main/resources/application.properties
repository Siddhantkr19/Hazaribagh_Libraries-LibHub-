# 1. Database Connection (The Phone Number)
spring.datasource.url=jdbc:mysql://localhost:3306/hazaribagh_libraries?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. JPA & Hibernate (The Chef Settings)
# "update" means: If you change your Java code (Entity), automatically update the MySQL table.
spring.jpa.hibernate.ddl-auto=update
# Show the SQL queries in the console (Good for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. Dialect (Optional but recommended)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
library.app.jwtSecret=${JWT_SECRET_KEY}
library.app.jwtExpirationMs=86400000
library.app.jwtCookieName=libhub-token-v3

# --- GMAIL SMTP SETTINGS ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=siddhantkumar7488@gmail.com
# CRITICAL
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# --- GOOGLE OAUTH2 SETTINGS ----
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email, profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# Razorpay Configuration
razorpay.key.id=${razorpay.key_id}
razorpay.key.secret=${razorpay.key.secret}