#server.port=8080  for locally
server.address=0.0.0.0
# 1. Database Connection (The Phone Number)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. JPA & Hibernate (The Chef Settings)
# "update" means: If you change your Java code (Entity), automatically update the MySQL table.
spring.jpa.hibernate.ddl-auto=update
# Show the SQL queries in the console (Good for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. Dialect (Optional but recommended)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Use environment variable for the JWT secret
library.app.jwtSecret=${JWT_SECRET_KEY}
library.app.jwtExpirationMs=86400000
library.app.jwtCookieName=libhub-token-v3
library.app.adminEmail=${ADMIN_EMAIL:siddhantkumar7488@gmail.com}
library.app.adminPassword=${ADMIN_PASSWORD:sidd@1234}

# --- GMAIL SMTP SETTINGS ---
# --- DYNAMIC EMAIL CONFIGURATION ---
# These values will now come from your Environment Variables (IntelliJ or Render)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- GOOGLE OAUTH2 SETTINGS ----
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email, profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# Razorpay Configuration
razorpay.key.id=${razorpay.key_id}
razorpay.key.secret=${razorpay.key.secret}

